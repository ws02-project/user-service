version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: user-service-postgres
    ports:
      - '5435:5432'
    environment:
      - POSTGRES_USER=useruser
      - POSTGRES_PASSWORD=userpass
      - POSTGRES_DB=userdb
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U useruser -d userdb']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  user-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: user-service-dev
    ports:
      - '3002:3002'
      - '50053:50053'
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:delegated
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.env:/app/.env:ro
      # Mount shared proto files
      - ../proto:/app/proto:ro
    environment:
      - NODE_ENV=development
      - PORT=3002
      - GRPC_PORT=50053
    command: pnpm dev:container
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-service-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-prod
    ports:
      - '3003:3002'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

volumes:
  postgres_data:
